# UrbanSense — Mosquitto MQTT broker config (dev)
# Edge event transport: priority-routed P0 (instant) .. P3 (buffered batch sync)

listener 1883
protocol mqtt

listener 9002
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Dev only — replace with password_file + allow_anonymous false before any
# non-local deployment. RBAC-restricted topics (incidents/ANPR) must not be
# reachable by anonymous clients in production.
allow_anonymous true
